      - "/run:size=64m,uid=100,gid=101,mode=0755"
      - "/app/logs:size=64m,uid=100,gid=101,mode=0755"
      - "/home/appuser/.cache:size=128m,uid=100,gid=101,mode=0755"
      - "/home/appuser/.local:size=512m,uid=100,gid=101,mode=0755"

  cv3-backend-database-manager:
    <<: *harden
    mem_limit: "1g"
    cpus: "1.0"
    # appuser HOME must be writable: the app (appdirs/IS_PYPI) creates its data dir
    # under ~/.local/share/CV3Backend and logs under ~/.cache/CV3Backend at startup.
    # tmpfs (mode 1777) is writable by the in-container appuser without the named-volume
    # ownership dance under userns remap - but it is EPHEMERAL. For an instance that
    # persists uploaded data, swap ~/.local for a pre-owned named volume (see SECURITY.md).
    tmpfs:
      - "/tmp:size=256m,uid=100,gid=101,mode=1777"
      - "/run:size=64m,uid=100,gid=101,mode=0755"
      - "/app/logs:size=64m,uid=100,gid=101,mode=0755"
      - "/home/appuser/.cache:size=128m,uid=100,gid=101,mode=0755"
      - "/home/appuser/.local:size=512m,uid=100,gid=101,mode=0755"

  cv3-backend-scheduler:
    <<: *harden
    mem_limit: "512m"
    cpus: "0.5"
    # appuser HOME must be writable: the app (appdirs/IS_PYPI) creates its data dir
    # under ~/.local/share/CV3Backend and logs under ~/.cache/CV3Backend at startup.
    # tmpfs (mode 1777) is writable by the in-container appuser without the named-volume
    # ownership dance under userns remap - but it is EPHEMERAL. For an instance that
    # persists uploaded data, swap ~/.local for a pre-owned named volume (see SECURITY.md).
    tmpfs:
      - "/tmp:size=256m,uid=100,gid=101,mode=1777"
      - "/run:size=64m,uid=100,gid=101,mode=0755"
      - "/app/logs:size=64m,uid=100,gid=101,mode=0755"
      - "/home/appuser/.cache:size=128m,uid=100,gid=101,mode=0755"
      - "/home/appuser/.local:size=512m,uid=100,gid=101,mode=0755"

  cv3-frontend:
    <<: *harden
    # Run AS the image's nginx user (uid 101). The stock nginx entrypoint only tries to
    # chown the cache dirs / drop workers when it starts as root - which fails under
    # cap_drop:ALL ("chown(...) failed: Operation not permitted"). Starting as 101 skips
    # all of that; it still needs NET_BIND_SERVICE to bind :80, and its writable paths
    # (cache/run/tmp) are tmpfs (mode 1777) so uid 101 can write them.
    user: "101:101"
    cap_add: ["NET_BIND_SERVICE"]
    mem_limit: "256m"
    cpus: "0.5"
    # tmpfs owned by nginx (101) so the non-root master can write cache/pid/temp paths.
    tmpfs:
      - "/tmp:size=64m,uid=101,gid=101,mode=1777"
      - "/run:size=64m,uid=101,gid=101,mode=0755"
      - "/var/cache/nginx:size=64m,uid=101,gid=101,mode=0755"
