# Dedicated egress policy for the CV3 TLS reverse proxy (Caddy = cv-proxy).
#
# Caddy terminates TLS for the whole deployment, so it sees every request in
# plaintext and holds the private key - a high-value target. To contain a
# supply-chain compromise of the Caddy image, cv-proxy is given NO direct route to
# the internet (it is off the `wan` network); its ONLY outbound path is this proxy,
# whose allowlist permits CONNECT *only* to the Let's Encrypt ACME endpoints Caddy
# needs to obtain/renew its certificate. Everything else is denied, so a compromised
# Caddy has no channel to exfiltrate the plaintext it terminates.

http_port 3128

# Policy gateway, not a cache.
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

# Reduce source leakage.
pinger_enable off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Forwarded deny all

# Destination allowlist - Let's Encrypt (+ optional DNS provider for DNS-01).
acl allowed_domains dstdomain "/etc/squid/allowed_domains.reverse-proxy.txt"

# Never let the proxy become an SSRF bridge into local, Docker, link-local, private,
# multicast, reserved or documentation networks. Notably blocks 169.254.169.254
# (cloud metadata) and the stack's own 172.16/12 Docker subnets.
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dstdomain dstdomain localhost .local .internal

# Restrict ports/methods. ACME is HTTPS via CONNECT to 443; plain 80 is permitted
# only so a CA endpoint that 301-redirects http->https stays usable.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_dst
http_access deny blocked_dstdomain

# Allow only the allowlisted Let's Encrypt / DNS-provider domains; deny the rest.
http_access allow allowed_domains
http_access deny all

# Audit every request (allowed and denied). squid drops to the unprivileged `proxy`
# user, which cannot open /dev/stdout directly; log to the file the image entrypoint
# already `tail -F`s to container stdout (visible via `docker logs cv-tls-egress-proxy`).
# With this tiny allowlist it is a quiet, exact record of everything Caddy reaches.
access_log stdio:/var/log/squid/access.log all
cache_log /dev/null
cache_store_log none
