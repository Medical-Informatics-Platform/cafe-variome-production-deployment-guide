# Install to: /etc/systemd/journald.conf.d/cv3-retention.conf   (as root/admin)
# then: install -d -m 2755 -g systemd-journal /var/log/journal && systemctl restart systemd-journald
# (Both are done by scripts/apply-host-tuning.sh.)
#
# The CV3 stack logs every container to the systemd journal (compose `journald`
# driver), because per-container json files are deleted on every container
# recreation. Access/audit logs are a requirement here, considering the industry.
# They must survive stack redeploys and host reboots and be retained for a year.
#
# NOTE — the CIS hardening sets Storage=persistent but does NOT create
# /var/log/journal, so the journal silently stays volatile (/run/log/journal, lost
# on reboot). Creating the directory is what actually makes it persistent.
#
# Retention model:
#   MaxRetentionSec  deletes entries OLDER than this (data minimisation after the
#                    mandated year). Size caps below must be generous enough that a
#                    full year FITS - if SystemMaxUse is hit first, journald evicts
#                    the OLDEST entries even if younger than a year. Watch usage with:
#                    journalctl --disk-usage
[Journal]
Storage=persistent
MaxRetentionSec=1year
# ~25% of a 40G test disk; raise on bigger hosts. Eviction is oldest-first.
SystemMaxUse=10G
SystemKeepFree=5G
# Access logs are bursty (one line per request); don't drop lines under load.
RateLimitIntervalSec=30s
RateLimitBurst=50000
