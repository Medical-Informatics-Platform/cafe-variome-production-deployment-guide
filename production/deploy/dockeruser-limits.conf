# Install to: /etc/security/limits.d/99-dockeruser.conf   (as root/admin)
#
# The CIS hardening sets a global `* soft nproc 512` / `* hard nproc 1024` in
# /etc/security/limits.conf to deter fork bombs. The CV3 stack (7 backend/frontend
# containers, plus optionally local Keycloak + Vault + MongoDB and the Caddy/Squid
# proxies) needs more processes/threads than that, and so does an admin running
# `sudo -iu dockeruser`. This per-user override raises the limit for the rootless
# Docker user only (a more-specific entry wins over the `*` wildcard). Reboot to be
# sure the PAM-session limits apply everywhere.
dockeruser  soft  nproc   65535
dockeruser  hard  nproc   65535
dockeruser  soft  nofile  1048576
dockeruser  hard  nofile  1048576
