# Install to: /etc/sysctl.d/99-cafevariome-unprivileged-ports.conf   (as root/admin)
# then: sudo sysctl --system
#
# Lets the rootless Docker user publish host ports 80 and 443 (the TLS reverse
# proxy). Rootless Docker binds host ports from inside the user's network namespace
# as an unprivileged user, so without this the daemon cannot bind anything below
# 1024 ("bind: permission denied") and the Caddy proxy fails to start.
#
# 80 (not 0) is the least-open value that still covers 80/443 - ports below 80
# (e.g. 22) stay privileged. Only needed for the reverse-proxy path.
net.ipv4.ip_unprivileged_port_start = 80
