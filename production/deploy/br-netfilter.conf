# Install to: ~dockeruser/.config/systemd/user/docker.service.d/br-netfilter.conf
# (as the dockeruser), then: systemctl --user daemon-reload && systemctl --user restart docker
#
# The hardened host has net.ipv4.ip_forward=0 and no br_netfilter, so the bridge
# netfilter sysctl (/proc/sys/net/bridge/bridge-nf-call-iptables) is absent. Our
# `internal: true` networks request inter-container-communication restriction,
# which needs that sysctl, so network creation fails with:
#   "cannot restrict inter-container communication ... bridge-nf-call-iptables:
#    no such file or directory"
# This tells the rootless daemon to proceed anyway. Isolation still holds via
# network topology (a container only has interfaces on the networks it joins, and
# there is no inter-bridge route - cross-network probes get ENETUNREACH); only the
# finer within-bridge iptables refinement is not enforced.
[Service]
Environment=DOCKER_IGNORE_BR_NETFILTER_ERROR=1
