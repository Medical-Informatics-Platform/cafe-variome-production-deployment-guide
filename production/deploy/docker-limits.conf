# Install to: ~dockeruser/.config/systemd/user/docker.service.d/docker-limits.conf
# (as the dockeruser), then: systemctl --user daemon-reload && systemctl --user restart docker
#
# Raises the rootless dockerd's own process/file/task limits so the daemon itself
# doesn't hit the hardening's `* hard nproc 1024` cap under a multi-container stack
# and crash with "fork: Resource temporarily unavailable" / "unexpected EOF".
# Pair with the /etc/security/limits.d entry (dockeruser-limits.conf) so login
# shells can fork too. Apply from a real login shell (`sudo -iu dockeruser`) so
# `systemctl --user` can reach the user bus.
[Service]
LimitNPROC=infinity
LimitNOFILE=1048576
TasksMax=infinity
