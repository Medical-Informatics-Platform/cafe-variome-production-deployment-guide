# Install to: /etc/systemd/system/user@.service.d/nofile.conf   (as root/admin)
# then: sudo systemctl daemon-reload && sudo systemctl restart "user@$(id -u dockeruser).service"
#
# Raises the open-file ceiling for *user* systemd managers. The CIS hardening
# leaves users at hard NOFILE=1024, and a rootless Docker daemon (a user service)
# cannot exceed its manager's limit even with LimitNOFILE=infinity in its own unit.
# Containers request NOFILE=2048, so without this the first container fails with:
#   "error setting rlimit type 7: operation not permitted"
[Service]
LimitNOFILE=1048576
