# Squid for federation egress (compose.federation.yml, CV_FEDERATION=1).
#
# The CV3 backends that talk to other installations send their outbound HTTP(S)
# here (HTTP(S)_PROXY; federation/sitecustomize.py makes aiohttp honour it).
# Default deny. Allowed destinations:
#   - allowed_domains.federation.txt   peer installations (+ a shared Keycloak)
#   - allowed_domains.cv-egress.txt    external Keycloak/Vault (external-infra mode)
# Private, loopback and link-local addresses stay blocked (SSRF, cloud metadata),
# unless the peer's address is listed in allowed_networks.federation.txt AND its
# hostname is in allowed_domains.federation.txt.

http_port 3128

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
pinger_enable off

forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Forwarded deny all

acl federation_domains dstdomain "/etc/squid/allowed_domains.federation.txt"
acl infra_domains dstdomain "/etc/squid/allowed_domains.cv-egress.txt"
acl federation_private_nets dst "/etc/squid/allowed_networks.federation.txt"

acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dstdomain dstdomain localhost .local .internal

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow federation_private_nets federation_domains
http_access deny blocked_dst
http_access deny blocked_dstdomain
http_access allow federation_domains
http_access allow infra_domains
http_access deny all

access_log stdio:/var/log/squid/access.log all
cache_log /dev/null
cache_store_log none
