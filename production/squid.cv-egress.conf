# Egress policy for the CV3 backends (cv-egress-proxy), EXTERNAL-infra mode.
#
# The backends reach an external Keycloak + Vault over HTTP(S). This proxy forces
# that traffic through a default-deny allowlist so a compromised backend cannot
# exfiltrate to, or pull payloads from, anywhere except the declared IAM/secret
# endpoints. Same hardened policy as the reverse-proxy egress, with a different
# allowlist file.

http_port 3128

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

pinger_enable off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Forwarded deny all

# Destination allowlist - your external Keycloak + Vault hosts (edit the file).
acl allowed_domains dstdomain "/etc/squid/allowed_domains.cv-egress.txt"

# SSRF / private-range / cloud-metadata blocks (apply before any allow).
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::1/128
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dstdomain dstdomain localhost .local .internal

# Ports/methods. HTTPS via CONNECT to 443; plain 80 for http->https redirects.
# If your external Keycloak/Vault listen on non-standard ports (e.g. 8080/8200),
# add them to Safe_ports and SSL_ports here.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_dst
http_access deny blocked_dstdomain

http_access allow allowed_domains
http_access deny all

access_log stdio:/dev/stdout all
cache_log /dev/null
cache_store_log none
